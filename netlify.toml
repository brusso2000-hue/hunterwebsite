[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Retired / consolidated URLs ─────────────────────────
# The dedicated pen store is now a filtered view of the main store.
[[redirects]]
  from = "/store-pen/"
  to = "/store/?line=micro-metallizer"
  status = 301

[[redirects]]
  from = "/store-pen"
  to = "/store/?line=micro-metallizer"
  status = 301

[[redirects]]
  from = "/store-pen.html"
  to = "/store/?line=micro-metallizer"
  status = 301

# Old flat .html paths from the hand-built site
[[redirects]]
  from = "/store.html"
  to = "/store/"
  status = 301

[[redirects]]
  from = "/resources.html"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Snipcart's crawler must always get JSON, never an HTML fallback.
[[headers]]
  for = "/products.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

# The sitemap moved from a hand-maintained file to Astro's generated index.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  # Forced: a stale sitemap.xml was still being served over the redirect.
  force = true
