[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Retired / consolidated URLs ─────────────────────────
# The old pen store ranked for "plating pen" terms; send it to the indexable
# Micro-Metallizer page (all pens, prices and links), not a canonicalized filter URL.
[[redirects]]
  from = "/store-pen/"
  to = "/systems/micro-metallizer/"
  status = 301

[[redirects]]
  from = "/store-pen"
  to = "/systems/micro-metallizer/"
  status = 301

[[redirects]]
  from = "/store-pen.html"
  to = "/systems/micro-metallizer/"
  status = 301

# Old flat .html paths from the hand-built site
[[redirects]]
  from = "/store.html"
  to = "/store/"
  status = 301

[[redirects]]
  from = "/resources.html"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Snipcart's crawler must always get JSON, never an HTML fallback.
[[headers]]
  for = "/products.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

# The sitemap moved from a hand-maintained file to Astro's generated index.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  # Forced: a stale sitemap.xml was still being served over the redirect.
  force = true

# ── Legacy URLs from the pre-2026 site (Search Console 404 report, Sep 2026) ──
# Each old page points to its closest current equivalent so links and
# rankings carry over instead of dead-ending.

[[redirects]]
  from = "/products/"
  to = "/store/"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/"
  status = 301

[[redirects]]
  from = "/catalogs/"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/price-sheets/"
  to = "/store/"
  status = 301

[[redirects]]
  from = "/safety-data-sheets/"
  to = "/contact/?topic=sds"
  status = 301

[[redirects]]
  from = "/store-carbitron/"
  to = "/systems/carbitron-300/"
  status = 301

[[redirects]]
  from = "/applications-carbitron/"
  to = "/systems/carbitron-300/"
  status = 301

[[redirects]]
  from = "/store-microjet/"
  to = "/systems/micro-jet-200/"
  status = 301

[[redirects]]
  from = "/applications-microjet/"
  to = "/systems/micro-jet-200/"
  status = 301

[[redirects]]
  from = "/micro_jet.html"
  to = "/systems/micro-jet-200/"
  status = 301

# Old PDF library
[[redirects]]
  from = "/docs/catalogs/Micro-Metallizer_Catalog.pdf"
  to = "/pdfs/Hunter_Micro-Metallizer_Catalog.pdf"
  status = 301

[[redirects]]
  from = "/docs/catalogs/Carbitron-Model-300_Catalog.pdf"
  to = "/pdfs/Carbitron_300_Brochure.pdf"
  status = 301

[[redirects]]
  from = "/docs/catalogs/Micro-Jet_Catalog.pdf"
  to = "/systems/micro-jet-200/"
  status = 301

[[redirects]]
  from = "/docs/catalogs/*"
  to = "/resources/"
  status = 301

# SDS are now provided on request
[[redirects]]
  from = "/docs/sds/*"
  to = "/contact/?topic=sds"
  status = 301

# Old price lists and order form; prices now live on the store
[[redirects]]
  from = "/docs/price/*"
  to = "/store/"
  status = 301

[[redirects]]
  from = "/docs/order-form.pdf"
  to = "/store/"
  status = 301
